<!DOCTYPE html>
<html lang="en">
<head>
    <title>Agartic</title>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" sizes="16x16" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Jersey+10&display=swap">
    <link rel="stylesheet" href="index.css"/>
    <script src="index.js" defer></script>
</head>
<body>

<div id="viewport">

    <div class="tips">
        <div class="a">
            <p>Scroll holding <kbd>Ctrl</kbd> to zoom</p>
            <p>Scroll holding <kbd>Ctrl</kbd> and <kbd>Shift</kbd> to zoom faster</p>
            <p>Hold <kbd>Shift</kbd> to scroll ←horizontally→</p>
        </div>
        <div class="b">
            <p>Both <kbd>C-Z</kbd> and <kbd>C-y</kbd> work as <i>redo</i></p>
        </div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="canvas-draw"></canvas>
        <canvas id="canvas-over"></canvas>
    </div>

    <div id="panel-main" class="panel">
        <button id="button_zoom_1"> <kbd>C-1</kbd>
            <img src="img/icons/zoom-original.png">
        </button>
        <button id="button_zoom_2"> <kbd>C-2</kbd>
            <img src="img/icons/zoom-fit-best.png">
        </button>
        <button id="button_zoom_out">
            <img src="img/icons/zoom-out.png">
        </button>
        <button id="button_zoom_in">
            <img src="img/icons/zoom-in.png">
        </button>
        <button id="button_undo">   <kbd>C-z</kbd>  <img src="img/icons/view-refresh.png" style="transform: scaleX(-1)"></button>
        <button id="button_redo">   <kbd>C-Z</kbd>  <img src="img/icons/view-refresh.png"></button>
        <button id="button_info">   <kbd>`</kbd>    <span>info  </span></button>
        <button id="tool_pick">     <kbd>c</kbd>    <span>color </span></button>
        <button id="button_fill">   <kbd>f</kbd>    <span>fill  </span></button>
        <button id="tool_drag">     <kbd>x</kbd>    <span>move  </span></button>
        <button id="tool_draw">     <kbd>d</kbd>    <span>draw  </span></button>
        <button id="tool_rect">     <kbd>r</kbd>    <span>rect  </span></button>
        <button id="tool_laso">     <kbd>q</kbd>    <span>laso  </span></button>
        <button id="tool_imgv" class="hide"></button>
        <button id="button_copy">   <kbd>C-c</kbd>
            <img src="img/icons/edit-copy.png">
        </button>
        <button id="button_paste">  <kbd><abbr title="Use shortcut to paste files!">C-v</abbr></kbd>
            <img src="img/icons/edit-paste.png">
        </button>
        <button id="button_save">   <kbd>C-s</kbd>
            <img src="img/icons/media-floppy.png">
        </button>
        <button id="button_delete"> <kbd>C-d</kbd>
            <img src="img/icons/user-trash-full-2.png">
        </button>
    </div>

    <div id="panel-aux" class="panel">
        <!-- DRAW -->
        <button id="button_thickness_less"
                class="tool_draw">
            <kbd>s</kbd>
            <img src="img/icons/list-remove.png">
        </button>
        <button id="button_thickness_more"
                class="tool_draw">
            <kbd>w</kbd>
            <img src="img/icons/list-add.png">
        </button>
        <div class="tool_draw">
            <img src="img/icons/media-record.png">
            <span id="out_thickness">3</span>
        </div>
        <div class="tool_draw tool_pick">
            <input type="color" id="input_color">
            <kbd>S-c</kbd>
            <input type="text" id="input_color_txt">
        </div>
        <!-- PLACING IMAGE -->
        <button id="cancelButton"
                class="tool_imgv">
            <kbd>Esc</kbd>
            <img src="img/icons/dialog-error.png">
        </button>
        <button id="okButton"
                class="tool_imgv">
            <kbd>Tab</kbd>
            <img src="img/icons/emblem-default.png">
        </button>
        <!-- ... -->
    </div>

</div>

<div id="brush_cursor"></div>

</body>
</html>
